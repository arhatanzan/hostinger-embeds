[build]
  publish = "public"
  command = "node scripts/build.mjs"

[dev]
  framework = "#static"
  publish = "public"
  port = 8888

# Hostinger pages fetch() blocks and embeds cross-origin
[[headers]]
  for = "/blocks/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/embeds/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/"
  to = "/admin/"
  status = 302
