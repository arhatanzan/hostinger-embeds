[build]
  publish = "public"
  command = "node scripts/build-blocks-index.mjs"

[dev]
  framework = "#static"
  publish = "public"
  port = 8888

# Embeds on kaifabbas.com fetch() blocks cross-origin
[[headers]]
  for = "/blocks/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/"
  to = "/admin/"
  status = 302
